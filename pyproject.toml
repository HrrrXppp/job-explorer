[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-explorer"
version = "0.1.0"
description = "Stateless CLI that matches job listings to local DOCX resumes and emails a ranked Gmail report."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["job-search", "gmail", "sentence-transformers", "cli", "pytest"]
authors = [{ name = "Evgenii Khrunov" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "httpx>=0.27",
    "jsonpath-ng>=1.6",
    "lxml>=5.2",
    "pydantic>=2.9",
    "python-docx>=1.1",
]

[project.urls]
Homepage = "https://github.com/HrrrXppp/job-explorer"
Repository = "https://github.com/HrrrXppp/job-explorer"
Issues = "https://github.com/HrrrXppp/job-explorer/issues"
"Pull requests" = "https://github.com/HrrrXppp/job-explorer/pulls"

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "respx>=0.21"]

[project.scripts]
job-explorer = "job_explorer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_explorer"]

[tool.hatch.build.targets.sdist]
include = ["src/job_explorer", "tests", "config.json", "config.example.json", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: optional tests that load a real sentence-transformers model",
]
