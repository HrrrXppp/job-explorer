name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install from lockfile (no sentence-transformers; matching is mocked)
        run: uv sync --extra dev --frozen
      - name: Test
        run: uv run pytest
